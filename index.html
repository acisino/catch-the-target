<!DOCTYPE html>
<html>
<head>
    <title>Catch the Target</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
            min-height: 100vh;
            user-select: none;
        }

        h1 {
            margin: 25px 10px 10px;
            font-size: 32px;
        }

        #info {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 5px;
            font-size: 17px;
            font-weight: bold;
            flex-wrap: wrap;
        }

        #score {
            color: #22c55e;
        }

        #timer {
            color: #facc15;
        }

        #highScore {
            color: #60a5fa;
        }

        #level {
            color: #f97316;
        }

        #combo {
            color: #ec4899;
        }

        #startButton {
            padding: 14px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background: #22c55e;
            color: white;
            cursor: pointer;
        }

        #startButton:active {
            transform: scale(0.95);
        }

        #startButton:disabled {
            background: #4b5563;
        }

        #message {
            font-size: 22px;
            font-weight: bold;
            margin: 20px 10px;
            min-height: 30px;
        }

        #gameArea {
            width: 90%;
            height: 500px;
            margin: 20px auto;
            background: #1f2937;
            border: 3px solid #374151;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            touch-action: manipulation;
        }

        #target {
            width: 60px;
            height: 60px;
            background: #ef4444;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(1);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.7);
            display: none;
            cursor: pointer;
        }

        #target.appear {
            animation: appear 0.18s ease-out;
        }

        #target.hit {
            animation: hit 0.12s ease-out;
        }

        @keyframes appear {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes hit {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }

            100% {
                transform: scale(1);
            }
        }

        #hitEffect {
            position: absolute;
            pointer-events: none;
            font-size: 28px;
            font-weight: bold;
            color: #facc15;
            display: none;
        }

        .game-over {
            font-size: 26px;
            color: #facc15;
        }

        .new-record {
            font-size: 26px;
            color: #22c55e;
        }
    </style>
</head>

<body>

    <h1>🎯 Catch the Target</h1>

    <div id="info">
        <div id="score">Score: 0</div>
        <div id="timer">Time: 30</div>
        <div id="highScore">Best: 0</div>
        <div id="level">Level: 1</div>
        <div id="combo">Combo: 0</div>
    </div>

    <button id="startButton">START GAME</button>

    <div id="message">Press START GAME to begin!</div>

    <div id="gameArea">
        <div id="target"></div>
        <div id="hitEffect">+1</div>
    </div>

    <script>

        let score = 0;
        let timeLeft = 30;
        let gameRunning = false;
        let timerInterval;

        let combo = 0;
        let lastHitTime = 0;

        let highScore = Number(localStorage.getItem("highScore")) || 0;

        const target = document.getElementById("target");
        const scoreDisplay = document.getElementById("score");
        const timerDisplay = document.getElementById("timer");
        const highScoreDisplay = document.getElementById("highScore");
        const levelDisplay = document.getElementById("level");
        const comboDisplay = document.getElementById("combo");
        const startButton = document.getElementById("startButton");
        const message = document.getElementById("message");
        const gameArea = document.getElementById("gameArea");
        const hitEffect = document.getElementById("hitEffect");

        highScoreDisplay.textContent = "Best: " + highScore;


        function moveTarget() {

            const maxX = gameArea.clientWidth - target.offsetWidth;
            const maxY = gameArea.clientHeight - target.offsetHeight;

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            target.style.left = randomX + "px";
            target.style.top = randomY + "px";

            target.classList.remove("appear");

            void target.offsetWidth;

            target.classList.add("appear");
        }


        function updateDifficulty() {

            let level;

            if (score < 10) {

                level = 1;

                target.style.width = "60px";
                target.style.height = "60px";

            } else if (score < 20) {

                level = 2;

                target.style.width = "52px";
                target.style.height = "52px";

            } else if (score < 30) {

                level = 3;

                target.style.width = "45px";
                target.style.height = "45px";

            } else if (score < 40) {

                level = 4;

                target.style.width = "40px";
                target.style.height = "40px";

            } else {

                level = 5;

                target.style.width = "35px";
                target.style.height = "35px";
            }

            levelDisplay.textContent = "Level: " + level;
        }


        function showHitEffect(points) {

            hitEffect.textContent = "+" + points;

            const x = parseFloat(target.style.left) || gameArea.clientWidth / 2;
            const y = parseFloat(target.style.top) || gameArea.clientHeight / 2;

            hitEffect.style.left = x + "px";
            hitEffect.style.top = y + "px";
            hitEffect.style.display = "block";

            setTimeout(function() {
                hitEffect.style.display = "none";
            }, 300);
        }


        function startGame() {

            score = 0;
            timeLeft = 30;
            combo = 0;
            lastHitTime = 0;
            gameRunning = true;

            scoreDisplay.textContent = "Score: 0";
            timerDisplay.textContent = "Time: 30";
            comboDisplay.textContent = "Combo: 0";
            levelDisplay.textContent = "Level: 1";

            message.textContent = "Catch it! 🎯";
            message.className = "";

            startButton.textContent = "GAME RUNNING...";
            startButton.disabled = true;

            target.style.display = "block";

            updateDifficulty();
            moveTarget();

            clearInterval(timerInterval);

            timerInterval = setInterval(function() {

                timeLeft = timeLeft - 1;

                timerDisplay.textContent = "Time: " + timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }

            }, 1000);
        }


        function endGame() {

            gameRunning = false;

            clearInterval(timerInterval);

            target.style.display = "none";

            startButton.disabled = false;
            startButton.textContent = "PLAY AGAIN";

            if (score > highScore) {

                highScore = score;

                localStorage.setItem("highScore", highScore);

                highScoreDisplay.textContent = "Best: " + highScore;

                message.textContent = "🏆 NEW RECORD! " + score;
                message.className = "new-record";

            } else {

                message.textContent = "🎉 Game Over! Score: " + score;
                message.className = "game-over";
            }
        }


        target.addEventListener("click", function() {

            if (!gameRunning) {
                return;
            }

            const now = Date.now();

            if (lastHitTime !== 0 && now - lastHitTime <= 1500) {
                combo = combo + 1;
            } else {
                combo = 1;
            }

            lastHitTime = now;

            let points = 1;

            if (combo >= 5) {
                points = 3;
            } else if (combo >= 3) {
                points = 2;
            }

            score = score + points;

            scoreDisplay.textContent = "Score: " + score;
            comboDisplay.textContent = "Combo: " + combo;

            showHitEffect(points);

            target.classList.remove("hit");

            void target.offsetWidth;

            target.classList.add("hit");

            updateDifficulty();
            moveTarget();
        });


        startButton.addEventListener("click", function() {

            if (!gameRunning) {
                startGame();
            }

        });

    </script>

</body>
</html>
